name: Desktop checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install display tools
        run: sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libgtk-3-0 libasound2t64
      - name: Boot the desktop application
        env:
          AW_USER_DATA_DIR: ${{ runner.temp }}/agentic-workspace-smoke
          AW_SMOKE_SCREENSHOT: ${{ runner.temp }}/office-preview.png
        run: xvfb-run -a npm run smoke -- --no-sandbox
      - name: Save desktop preview
        uses: actions/upload-artifact@v4
        with:
          name: desktop-preview
          path: |
            ${{ runner.temp }}/office-preview.png
            ${{ runner.temp }}/handoff-preview.png
